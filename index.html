<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GDP - tellzzang.com</title>
  
  <!-- 모바일 웹앱(PWA) 지원 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #f7f6f3;
    }
    
    /* 상단 미니 네비게이션 헤더 */
    header {
      height: 48px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      z-index: 100;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #111827;
      font-weight: 700;
      font-size: 15px;
    }
    .badge {
      background: #2563eb;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .nav-buttons {
      display: flex;
      gap: 8px;
    }
    .btn {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-notion {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .btn-notion:hover {
      background: #e5e7eb;
      color: #111827;
    }
    .btn-blog {
      background: #111827;
      color: #ffffff;
    }
    .btn-blog:hover {
      background: #1f2937;
    }

    /* 노션 메인 뷰어 */
    main {
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="https://tellzzang.com" class="brand" title="탤짱닷컴 메인으로 이동">
      <span>탤짱닷컴</span>
      <span class="badge">GDP</span>
    </a>
    <div class="nav-buttons">
      <a href="https://tellzzang.notion.site/40874dee06b380ab9307e9f46aa64265" target="_blank" rel="noopener noreferrer" class="btn btn-notion">
        노션 새창으로 열기 ↗
      </a>
      <a href="https://tellzzang.com" class="btn btn-blog">
        블로그
      </a>
    </div>
  </header>

  <main>
    <iframe 
      id="notionFrame"
      src="https://tellzzang.notion.site/40874dee06b380ab9307e9f46aa64265" 
      allow="fullscreen"
      loading="lazy">
    </iframe>
  </main>

</body>
</html>
